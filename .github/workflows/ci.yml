name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://desk:desk@localhost:5432/desk_test' || '' }}
        run: pytest

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health, login and an authorised call
        run: |
          curl -fsS http://localhost:8000/health
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ops1@example.com","password":"ops123"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:8000/api/episodes?limit=1" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"] == 173, d["total"]; print("episodes:", d["total"])'
          curl -fsS http://localhost:8000/ | grep -q "Dataset Request Desk"
      - name: Restart is idempotent
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          docker compose logs app | grep -c '"imported": 0'
      - name: Logs
        if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
